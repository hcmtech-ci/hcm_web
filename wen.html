<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Team - Outline to V2Ray VPN Service</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #090d16 50%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); padding: 20px 16px 40px 16px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 480px; width: 100%; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-sub); font-size: 13px; margin-top: 4px; }
        .contact-box { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 12px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .contact-btn { color: #60a5fa; text-decoration: none; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-main); font-weight: bold; cursor: pointer; text-align: center; }
        .nav-btn.active { background: #2563eb; border-color: #3b82f6; }
        .category-title { font-size: 14px; font-weight: 700; color: #93c5fd; margin: 16px 0 10px 4px; }
        .package-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; cursor: pointer; position: relative; }
        .card-title { font-size: 15px; font-weight: 700; color: #fff; }
        .card-price { font-size: 18px; font-weight: 800; color: #10b981; margin-top: 4px; }
        .card-price span { font-size: 11px; color: var(--text-sub); }
        .btn-action { width: 100%; background: #10b981; color: white; padding: 10px; border-radius: 8px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>HCM Team</h1>
        <p>Outline to V2Ray Premium VPN Service</p>
    </div>

    <div class="contact-box">
        <a href="https://t.me/akuma_edu" class="contact-btn"><i class="fab fa-telegram"></i> Telegram</a>
        <a href="viber://chat?number=%2B959123456789" class="contact-btn"><i class="fab fa-viber"></i> Viber</a>
        <a href="tel:09767661201" class="contact-btn"><i class="fas fa-phone"></i> Call Direct</a>
    </div>

    <div class="nav-tabs">
        <div class="nav-btn active" onclick="showSection('pricing')">💎 VPN ဈေးနှုန်းများ</div>
        <div class="nav-btn" onclick="showSection('free')">🎁 Free Key ရယူရန်</div>
    </div>

    <!-- Pricing Section -->
    <div id="pricing-section">
        <div class="category-title">📦 VIP Packages</div>
        <div class="package-grid">
            <div class="card">
                <div class="card-title">100 GB (30 Days)</div>
                <div class="card-price">3,000 <span>MMK</span></div>
                <button class="btn-action" onclick="window.open('https://t.me/akuma_edu')">မှာယူမည်</button>
            </div>
            <div class="card">
                <div class="card-title">300 GB (30 Days)</div>
                <div class="card-price">7,000 <span>MMK</span></div>
                <button class="btn-action" onclick="window.open('https://t.me/akuma_edu')">မှာယူမည်</button>
            </div>
        </div>
    </div>

    <!-- Free Keys Section -->
    <div id="free-section" style="display: none;">
        <div class="category-title">⚡ Free Server Keys</div>
        <div id="free-keys-list" class="package-grid" style="grid-template-columns: 1fr;"></div>
    </div>
</div>

<script>
    function showSection(type) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        if (type === 'pricing') {
            document.getElementById('pricing-section').style.display = 'block';
            document.getElementById('free-section').style.display = 'none';
            event.target.classList.add('active');
        } else {
            document.getElementById('pricing-section').style.display = 'none';
            document.getElementById('free-section').style.display = 'block';
            event.target.classList.add('active');
            loadFreeKeys();
        }
    }

    function loadFreeKeys() {
        const keys = JSON.parse(localStorage.getItem('hcm_free_keys') || '[]');
        const list = document.getElementById('free-keys-list');
        list.innerHTML = '';
        if (keys.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:20px;">လက်ရှိ Free Key များ မရှိသေးပါ။</div>';
            return;
        }
        keys.forEach(k => {
            list.innerHTML += `
                <div class="card">
                    <div class="card-title">${k.name}</div>
                    <div style="font-size:12px; color:#9ca3af; margin: 4px 0;">Data: ${k.gb} | Expiry: ${k.expiry}</div>
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <button class="btn-action" style="background:#3b82f6;" onclick="window.open('${k.link}')">3X-UI Sub Dashboard</button>
                        <button class="btn-action" onclick="navigator.clipboard.writeText('${k.link}'); alert('Copy ကူးပြီးပါပြီ!');">Copy Link</button>
                    </div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
